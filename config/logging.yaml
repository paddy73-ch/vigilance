version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    class: "pythonjsonlogger.jsonlogger.JsonFormatter"
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"

handlers:
  console:
    class: "logging.StreamHandler"
    formatter: "default"
    stream: "ext://sys.stdout"
    level: "INFO"
  file:
    class: "logging.handlers.RotatingFileHandler"
    formatter: "json"
    filename: "/app/data/vigilance.log"
    maxBytes: 10485760
    backupCount: 5
    level: "DEBUG"

loggers:
  vigilance:
    level: "DEBUG"
    handlers: ["console", "file"]
    propagate: false
  uvicorn:
    level: "INFO"
    handlers: ["console"]
    propagate: false
  sqlalchemy:
    level: "WARNING"
    handlers: ["console"]
    propagate: false
  apscheduler:
    level: "INFO"
    handlers: ["console"]
    propagate: false

root:
  level: "INFO"
  handlers: ["console"]