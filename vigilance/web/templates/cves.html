{% extends "base.html" %}

{% block title %}CVE Database - Vigilance{% endblock %}

{% block content %}
<div x-data="cvesPage()" x-init="loadCves(); loadSyncStatus(); openLinkedCve()">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
        <h1 class="text-2xl font-bold">CVE Database</h1>
        <div class="flex flex-wrap gap-2">
            <select x-model="filters.source" @change="loadCves()" class="input-field">
                <option value="">All Sources</option>
                <option value="osv">OSV</option>
                <option value="ghsa">GitHub Advisory</option>
                <option value="nvd">NVD</option>
                <option value="debian">Debian</option>
                <option value="ubuntu">Ubuntu</option>
            </select>
            <select x-model="filters.severity" @change="loadCves()" class="input-field">
                <option value="">All Severities</option>
                <option value="CRITICAL">Critical</option>
                <option value="HIGH">High</option>
                <option value="MEDIUM">Medium</option>
                <option value="LOW">Low</option>
                <option value="NONE">None</option>
            </select>
            <button @click="triggerSync()" class="btn-primary">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Sync All
            </button>
        </div>
    </div>

    <!-- Sync Status Cards -->
    <div class="space-y-2 mb-6">
        <template x-for="sync in syncStatus" :key="sync.source">
            <div class="flex items-center justify-between gap-4 px-3 py-2 bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700">
                <span class="font-medium capitalize" x-text="sync.source"></span>
                <span class="text-sm text-gray-500 dark:text-gray-400" x-text="sync.entries_count + ' entries, Last: ' + (sync.last_success_at ? formatDate(sync.last_success_at) : 'Never')"></span>
                <div class="flex items-center gap-3">
                    <span :class="vigilanceSync.cls(sync)" :title="vigilanceSync.title(sync)" x-text="vigilanceSync.label(sync)"></span>
                    <button x-show="vigilanceSync.canRetry(sync)" @click="retrySource(sync)" class="shrink-0 text-blue-600 hover:text-blue-800" title="Quelle erneut synchronisieren" aria-label="Quelle erneut synchronisieren">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5m11 11v-5h-5M5.5 9A7 7 0 0117 6.5L20 9m-1.5 6A7 7 0 017 17.5L4 15"></path></svg>
                    </button>
                </div>
                <span x-show="sync.error_message" class="sr-only" x-text="sync.error_message"></span>
            </div>
        </template>
    </div>

    <!-- CVE Table -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">CVE ID</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Source</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Severity</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">CVSS</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Title</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Published</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Fetched</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                <template x-for="cve in cves" :key="cve.id">
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer" @click="viewDetails(cve.cve_id)">
                        <td class="px-4 py-3 font-mono text-blue-600 hover:underline" x-text="cve.cve_id"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400 capitalize" x-text="cve.source"></td>
                        <td class="px-4 py-3">
                            <span :class="getSeverityClass(cve.severity)" x-text="cve.severity"></span>
                        </td>
                        <td class="px-4 py-3 text-sm font-mono" x-text="cve.cvss_score || 'N/A'"></td>
                        <td class="px-4 py-3 text-sm text-gray-900 dark:text-gray-100 truncate max-w-xs" x-text="cve.title"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400" x-text="formatDate(cve.published_at)"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400" x-text="formatDate(cve.fetched_at)"></td>
                    </tr>
                </template>
            </tbody>
        </table>

        <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="'Showing ' + ((pagination.page - 1) * pagination.limit + 1) + ' to ' + Math.min(pagination.page * pagination.limit, pagination.total) + ' of ' + pagination.total"></span>
            <div class="flex space-x-2">
                <button @click="prevPage()" :disabled="pagination.page <= 1" class="btn-secondary text-sm">Previous</button>
                <button @click="nextPage()" :disabled="pagination.page * pagination.limit >= pagination.total" class="btn-primary text-sm">Next</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div x-show="showDetailsModal" x-transition class="fixed inset-0 z-50 overflow-y-auto" @click.outside="closeDetailsModal()">
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-3xl w-full p-6 max-h-[80vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold" x-text="selectedCve?.cve_id || ''"></h3>
                    <button @click="closeDetailsModal()" class="text-gray-500 hover:text-gray-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div x-html="detailsHtml"></div>
            </div>
        </div>
    </div>
</div>

<script>
function cvesPage() {
    return {
        cves: [],
        syncStatus: [],
        filters: { source: '', severity: '' },
        pagination: { page: 1, limit: 50, total: 0 },
        showDetailsModal: false,
        selectedCve: null,
        detailsHtml: '',

        async openLinkedCve() {
            const cveId = new URLSearchParams(window.location.search).get('cve_id');
            if (!cveId) return;
            try {
                const resp = await fetch('/api/cves/' + encodeURIComponent(cveId));
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                this.selectedCve = await resp.json();
                this.detailsHtml = this.renderDetails(this.selectedCve);
                this.showDetailsModal = true;
            } catch (e) {
                alert('CVE-Details konnten nicht geladen werden');
            }
        },

        async loadCves() {
            const params = new URLSearchParams();
            params.append('source', this.filters.source);
            params.append('severity', this.filters.severity);
            params.append('limit', this.pagination.limit);
            params.append('offset', (this.pagination.page - 1) * this.pagination.limit);

            try {
                const resp = await fetch('/api/cves?' + params.toString());
                this.cves = await resp.json();
            } catch (e) {
                console.error('Failed to load CVEs', e);
            }
        },
        async loadSyncStatus() {
            try {
                const resp = await fetch('/api/cves/sync/status');
                this.syncStatus = vigilanceSync.visible(await resp.json());
                if (this.syncStatus.some(s => s.status === 'running')) {
                    setTimeout(() => this.loadSyncStatus(), 2000);
                }
            } catch (e) {
                console.error('Failed to load sync status', e);
            }
        },
        async triggerSync() {
            if (!confirm('Sync CVE database from all sources? This may take a while.')) return;
            try {
                const resp = await fetch('/api/cves/sync', { method: 'POST' });
                const data = await resp.json();
                alert('CVE-Sync gestartet');
                this.loadCves();
                this.loadSyncStatus();
            } catch (e) {
                alert('Failed to trigger sync');
            }
        },
        async retrySource(sync) {
            sync.status = 'running';
            sync.error_message = null;
            try {
                const resp = await fetch('/api/cves/sync?source=' + encodeURIComponent(sync.source), { method: 'POST' });
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.detail || `HTTP ${resp.status}`);
                }
            } catch (e) {
                sync.status = 'error';
                sync.error_message = e.message;
                alert(`${sync.source.toUpperCase()}-Synchronisierung konnte nicht gestartet werden: ${e.message}`);
            }
            this.loadSyncStatus();
        },
        async viewDetails(id) {
            try {
                const resp = await fetch('/api/cves/' + encodeURIComponent(id));
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                this.selectedCve = data.cve || data;
                this.detailsHtml = this.renderDetails(this.selectedCve);
                this.showDetailsModal = true;
            } catch (e) {
                alert('Failed to load details');
            }
        },
        renderDetails(cve) {
            const e = window.vigilanceEscape;
            let html = `
                <div class="space-y-4">
                    <div class="p-4 bg-gray-50 dark:bg-gray-700 rounded">
                        <h4 class="font-semibold">${e(cve.cve_id || 'Unknown CVE')}</h4>
                        <p class="text-sm text-gray-500">${e(cve.title || 'No title')}</p>
                    </div>
                    <dl class="space-y-2 text-sm grid grid-cols-2 gap-x-4 gap-y-2">
                        <dt class="font-medium">Source:</dt>
                        <dd class="capitalize">${e(cve.source || 'Unknown')}</dd>
                        <dt class="font-medium">Severity:</dt>
                        <dd class="text-${this.getSeverityColor(cve.severity)}">${e(cve.severity || 'NONE')}</dd>
                        <dt class="font-medium">CVSS Score:</dt>
                        <dd>${e(cve.cvss_score || 'N/A')}</dd>
                        <dt class="font-medium">CVSS Vector:</dt>
                        <dd class="font-mono text-xs">${e(cve.cvss_vector || 'N/A')}</dd>
                        <dt class="font-medium">Published:</dt>
                        <dd>${e(this.formatDate(cve.published_at))}</dd>
                        <dt class="font-medium">Modified:</dt>
                        <dd>${e(this.formatDate(cve.modified_at))}</dd>
                        <dt class="font-medium">Fetched:</dt>
                        <dd>${e(this.formatDate(cve.fetched_at))}</dd>
                    </dl>
                    <div>
                        <h5 class="font-medium mb-2">Description:</h5>
                        <p class="whitespace-pre-wrap text-sm">${e(cve.description || 'No description')}</p>
                    </div>
            `;

            if (cve.affected_ranges) {
                try {
                    const ranges = JSON.parse(cve.affected_ranges);
                    if (ranges.length) {
                        html += '<div><h5 class="font-medium mb-2">Affected Ranges:</h5><ul class="space-y-1 text-sm">';
                        ranges.forEach(r => {
                            html += `<li><code>${e(r.type)}: introduced=${e(r.introduced)}, fixed=${e(r.fixed || 'N/A')}, repo=${e(r.repo || 'N/A')}</code></li>`;
                        });
                        html += '</ul></div>';
                    }
                } catch (e) {}
            }

            if (cve.references) {
                try {
                    const refs = JSON.parse(cve.references);
                    if (refs.length) {
                        html += '<div class="mt-4"><h5 class="font-medium mb-2">References:</h5><ul class="space-y-1 text-sm">';
                        refs.slice(0, 15).forEach(r => {
                            if (!/^https?:\/\//i.test(r.url || '')) return;
                            html += `<li><a href="${e(r.url)}" target="_blank" rel="noopener noreferrer" class="text-blue-600">${e(r.type)}: ${e(r.url)}</a></li>`;
                        });
                        html += '</ul></div>';
                    }
                } catch (e) {}
            }

            html += '</div>';
            return html;
        },
        getSeverityColor(sev) {
            const colors = { CRITICAL: 'red-600', HIGH: 'orange-600', MEDIUM: 'yellow-600', LOW: 'blue-600', NONE: 'gray-500' };
            return colors[sev] || 'gray-500';
        },
        getSeverityClass(sev) {
            const classes = { CRITICAL: 'bg-red-100 text-red-800', HIGH: 'bg-orange-100 text-orange-800', MEDIUM: 'bg-yellow-100 text-yellow-800', LOW: 'bg-blue-100 text-blue-800', NONE: 'bg-gray-100 text-gray-800' };
            return 'px-2 py-1 rounded text-xs font-medium ' + (classes[sev] || classes.NONE);
        },
        formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            return new Date(dateStr).toLocaleString();
        },
        prevPage() { if (this.pagination.page > 1) { this.pagination.page--; this.loadCves(); } },
        nextPage() { if (this.pagination.page * this.pagination.limit < this.pagination.total) { this.pagination.page++; this.loadCves(); } },
        closeDetailsModal() { this.showDetailsModal = false; this.selectedCve = null; }
    }
}
</script>
{% endblock %}
