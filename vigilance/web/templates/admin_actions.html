{% extends "base.html" %}
{% block title %}Aktionen{% endblock %}
{% block page_script %}<script defer src="/static/js/actions.js?v={{ asset_version }}"></script>{% endblock %}
{% block content %}
{% include "_admin_tabs.html" %}
<div x-data="actionsHistory" x-cloak>
  <section class="panel">
    <div class="panel-head"><h2>Ausgeführte Aktionen</h2><span class="muted" x-show="busy">Läuft gerade</span></div>
    <template x-if="runs && !runs.length">
      <div class="empty"><h3>Noch nichts ausgeführt</h3>
        <p>Updates und das Entfernen von Altpaketen startest du in der <a href="/hosts">Hostliste</a> für alle Container oder im Detail eines Containers. Der Proxmox-Host wird nie verändert.</p></div>
    </template>
    <table class="rows" x-show="runs && runs.length">
      <thead><tr><th>Zeit</th><th>Container</th><th>Aktion</th><th>Status</th><th>Von</th><th></th></tr></thead>
      <template x-for="r in (runs || [])" :key="r.id">
        <tbody>
          <tr>
            <td data-label="Zeit" x-text="V.date(r.started_at || r.created_at)"></td>
            <td data-label="Container"><a :href="r.host_id ? '/hosts/' + r.host_id : '#'" x-text="r.host"></a></td>
            <td data-label="Aktion" x-text="kindLabel(r.kind)"></td>
            <td data-label="Status"><span class="tag" :class="statusClass(r.status)" x-text="statusLabel(r.status)"></span>
              <span class="faint" x-show="r.exit_code !== null && r.exit_code !== 0" x-text="'Exit ' + r.exit_code"></span></td>
            <td data-label="Von" class="faint" x-text="r.created_by || ''"></td>
            <td class="right"><button class="btn btn-sm" @click="toggle(r)" x-text="open[r.id] ? 'Schliessen' : 'Details'"></button></td>
          </tr>
          <template x-if="open[r.id]">
            <tr class="sub"><td colspan="6">
              <div class="stack">
                <div class="cmd" x-show="r.commands.length"><code x-text="r.commands.join('\n')"></code></div>
                <ul class="act-skipped" x-show="r.skipped.length">
                  <template x-for="s in r.skipped" :key="s.package"><li><span class="pkg" x-text="s.package"></span> <span class="faint" x-text="'übersprungen: ' + s.reason"></span></li></template>
                </ul>
                <pre class="log" x-show="open[r.id].output" x-text="open[r.id].output"></pre>
              </div>
            </td></tr>
          </template>
        </tbody>
      </template>
    </table>
  </section>
</div>
{% endblock %}
