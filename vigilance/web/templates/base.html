<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Vigilance{% endblock %} – Vigilance</title>
    <link rel="icon" href="/static/images/vigilance-logo.jpeg">
    <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
    <script defer src="/static/js/app.js?v={{ asset_version }}"></script>
    {% block page_script %}{% endblock %}
    <script defer src="/static/vendor/alpine-3.17.5.min.js"></script>
</head>
<body>
    {% set path = request.url.path %}
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/" class="brand"><img src="/static/images/vigilance-logo.jpeg" alt=""><span>Vigilance</span></a>
            <nav class="nav" aria-label="Hauptnavigation">
                <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Übersicht</a>
                <a href="/hosts" {% if path.startswith('/hosts') %}aria-current="page"{% endif %}>Hosts</a>
                <a href="/vulnerabilities" {% if path.startswith('/vulnerabilities') %}aria-current="page"{% endif %}>Schwachstellen</a>
                <a href="/admin/sources" {% if path.startswith('/admin') %}aria-current="page"{% endif %}>Verwaltung</a>
            </nav>
            <div class="topbar-end">
                <a href="/admin/limits" class="limits-link" {% if path == '/admin/limits' %}aria-current="page"{% endif %} title="Was Vigilance nicht prüft oder nur ungenau beurteilt">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.2v.1"/></svg>
                    <span>Grenzen</span>
                </a>
                <button type="button" id="auth-state" class="lock" data-unlocked="false">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></svg>
                    <span data-label>Bearbeiten</span>
                </button>
            </div>
        </div>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
    <footer class="page-foot">
        Vigilance zeigt bekannte Lücken in den geprüften Daten, nicht alles. <a href="/admin/limits">Grenzen von Vigilance</a>
    </footer>
</body>
</html>
