<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vigilance{% endblock %}</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/vigilance.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-blue-600 dark:text-blue-400">
                        Vigilance
                    </a>
                    <div class="nav-tabs" aria-label="Main navigation">
                        <a href="/" class="nav-link{% if request.url.path == '/' %} active{% endif %}"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Dashboard</a>
                        <a href="/nodes" class="nav-link{% if request.url.path == '/nodes' %} active{% endif %}"{% if request.url.path == '/nodes' %} aria-current="page"{% endif %}>Nodes</a>
                        <a href="/findings" class="nav-link{% if request.url.path == '/findings' %} active{% endif %}"{% if request.url.path == '/findings' %} aria-current="page"{% endif %}>Findings</a>
                        <a href="/containers" class="nav-link{% if request.url.path == '/containers' %} active{% endif %}"{% if request.url.path == '/containers' %} aria-current="page"{% endif %}>Containers</a>
                        <a href="/cves" class="nav-link{% if request.url.path == '/cves' %} active{% endif %}"{% if request.url.path == '/cves' %} aria-current="page"{% endif %}>CVE Database</a>
                        <a href="/suppressions" class="nav-link{% if request.url.path == '/suppressions' %} active{% endif %}"{% if request.url.path == '/suppressions' %} aria-current="page"{% endif %}>Suppressions</a>
                        <a href="/overrides" class="nav-link{% if request.url.path == '/overrides' %} active{% endif %}"{% if request.url.path == '/overrides' %} aria-current="page"{% endif %}>Overrides</a>
                        <a href="/settings" class="nav-link{% if request.url.path == '/settings' %} active{% endif %}"{% if request.url.path == '/settings' %} aria-current="page"{% endif %}>Settings</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-info" class="text-sm text-gray-500 dark:text-gray-400"></span>
                    <div x-data="{ dropdownOpen: false }" class="relative">
                        <button @click="dropdownOpen = !dropdownOpen" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </button>
                        <div x-show="dropdownOpen" @click.outside="dropdownOpen = false" class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 border border-gray-200 dark:border-gray-700 z-50">
                            <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Settings</a>
                            <hr class="border-gray-200 dark:border-gray-700">
                            <span class="block px-4 py-2 text-sm text-gray-500 dark:text-gray-400">v0.1.0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-4 text-center text-sm text-gray-500 dark:text-gray-400">
            Vigilance - Self-hosted Security & Patch Monitoring for Proxmox
        </div>
    </footer>

    <script>
        // Check auth status on load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const resp = await fetch('/api/auth/me');
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('user-info').textContent = `Logged in as ${data.username} (${data.auth_method})`;
                }
            } catch (e) {
                // Ignore
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
