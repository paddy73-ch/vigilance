{% extends "base.html" %}

{% block title %}Suppressions - Vigilance{% endblock %}

{% block content %}
<div x-data="suppressionsPage()" x-init="loadSuppressions()">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Suppressions</h1>
        <button @click="showCreateModal = true" class="btn-primary">
            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Add Suppression
        </button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">CVE ID</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Tool Pattern</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Host</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Reason</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Expires</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Created By</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Created</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                <template x-for="supp in suppressions" :key="supp.id">
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
                        <td class="px-4 py-3 font-mono text-blue-600" x-text="supp.cve_id"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400" x-text="supp.tool_name_pattern || 'Any'"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400" x-text="supp.inventory_name || 'Any'"></td>
                        <td class="px-4 py-3 text-sm text-gray-900 dark:text-gray-100 max-w-xs truncate" x-text="supp.reason"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400" x-text="supp.expires_at ? formatDate(supp.expires_at) : 'Never'"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400" x-text="supp.created_by || 'Unknown'"></td>
                        <td class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400" x-text="formatDate(supp.created_at)"></td>
                        <td class="px-4 py-3 text-right text-sm">
                            <button @click="deleteSuppression(supp.id)" class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Create Modal -->
    <div x-show="showCreateModal" x-transition class="fixed inset-0 z-50 overflow-y-auto" @click.outside="closeModal()">
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full p-6">
                <h3 class="text-lg font-semibold mb-4">Add Suppression</h3>
                <form @submit.prevent="createSuppression()">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">CVE ID</label>
                        <input type="text" name="cve_id" x-model="form.cve_id" required placeholder="CVE-2024-XXXX or GHSA-xxxx" class="input-field w-full">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tool Name Pattern (optional)</label>
                        <input type="text" name="tool_name_pattern" x-model="form.tool_name_pattern" placeholder="nginx, openssl*, etc." class="input-field w-full">
                        <p class="text-xs text-gray-500 mt-1">Supports wildcards (*)</p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Host (optional)</label>
                        <select name="inventory_id" x-model="form.inventory_id" class="input-field w-full">
                            <option value="">Any Host</option>
                            <template x-for="inv in inventories" :key="inv.id">
                                <option :value="inv.id" x-text="inv.name + ' (' + (inv.ip_address || 'no IP') + ')'"></option>
                            </template>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Reason</label>
                        <textarea name="reason" x-model="form.reason" required rows="3" class="input-field w-full"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Expires (optional)</label>
                        <input type="datetime-local" name="expires_at" x-model="form.expires_at" class="input-field w-full">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" @click="closeModal()" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function suppressionsPage() {
    return {
        suppressions: [],
        inventories: [],
        showCreateModal: false,
        form: { cve_id: '', tool_name_pattern: '', inventory_id: '', reason: '', expires_at: '' },

        async loadSuppressions() {
            try {
                const [suppressionsResp, inventoriesResp] = await Promise.all([
                    fetch('/api/suppressions'),
                    fetch('/api/nodes') // We'll need a separate endpoint for all inventories
                ]);
                this.suppressions = await suppressionsResp.json();
                // For now, skip inventories loading
            } catch (e) {
                console.error('Failed to load suppressions', e);
            }
        },
        closeModal() {
            this.showCreateModal = false;
            this.form = { cve_id: '', tool_name_pattern: '', inventory_id: '', reason: '', expires_at: '' };
        },
        async createSuppression() {
            try {
                const resp = await fetch('/api/suppressions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                if (resp.ok) {
                    this.closeModal();
                    this.loadSuppressions();
                } else {
                    alert('Failed to create suppression');
                }
            } catch (e) {
                alert('Error creating suppression');
            }
        },
        async deleteSuppression(id) {
            if (!confirm('Delete this suppression?')) return;
            try {
                const resp = await fetch('/api/suppressions/' + id, { method: 'DELETE' });
                if (resp.ok) this.loadSuppressions();
            } catch (e) {
                alert('Failed to delete suppression');
            }
        },
        formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleString();
        }
    }
}
</script>
{% endblock %}
