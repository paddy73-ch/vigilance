{% extends "base.html" %}

{% block title %}Nodes - Vigilance{% endblock %}

{% block content %}
<div x-data="nodesPage()" x-init="loadNodes()">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Proxmox Nodes</h1>
        <button @click="showCreateModal = true" class="btn-primary">
            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Add Node
        </button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">URL</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Token ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">TLS Verify</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">VMs</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">LXCs</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                <template x-for="node in nodes" :key="node.id">
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900 dark:text-gray-100" x-text="node.name"></div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400" x-text="node.url"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400" x-text="node.token_id"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span :class="node.verify_tls ? 'text-green-600' : 'text-red-600'">
                                <span x-text="node.verify_tls ? 'Yes' : 'No'"></span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400" x-text="node.vm_count"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400" x-text="node.lxc_count"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button @click="editNode(node)" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>
                            <button @click="deleteNode(node.id)" class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Create/Edit Modal -->
    <div x-show="showCreateModal" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="fixed inset-0 z-50 overflow-y-auto" @click.outside="closeModal()">
        <div class="flex min-h-full items-center justify-center p-4">
            <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full p-6">
                <h3 class="text-lg font-semibold mb-4" x-text="editingNode ? 'Edit Node' : 'Add Node'"></h3>
                <form @submit.prevent="saveNode()">
                    <input type="hidden" name="id" x-model="form.id">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
                        <input type="text" name="name" x-model="form.name" required class="input-field w-full">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">URL</label>
                        <input type="url" name="url" x-model="form.url" required class="input-field w-full">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Token ID</label>
                        <input type="text" name="token_id" x-model="form.token_id" required class="input-field w-full">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Token Secret</label>
                        <input type="password" name="token_secret" x-model="form.token_secret" :required="!editingNode" class="input-field w-full" placeholder="Leave empty to keep current">
                    </div>
                    <div class="mb-4 flex items-center">
                        <input type="checkbox" name="verify_tls" x-model="form.verify_tls" id="verify_tls" class="h-4 w-4">
                        <label for="verify_tls" class="ml-2 text-sm text-gray-700 dark:text-gray-300">Verify TLS</label>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" @click="closeModal()" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function nodesPage() {
    return {
        nodes: [],
        showCreateModal: false,
        editingNode: false,
        form: { name: '', url: '', token_id: '', token_secret: '', verify_tls: true },

        async loadNodes() {
            try {
                const resp = await fetch('/api/nodes');
                this.nodes = await resp.json();
            } catch (e) {
                console.error('Failed to load nodes', e);
            }
        },
        editNode(node) {
            this.editingNode = true;
            this.form = { ...node, token_secret: '' };
            this.showCreateModal = true;
        },
        closeModal() {
            this.showCreateModal = false;
            this.editingNode = false;
            this.form = { name: '', url: '', token_id: '', token_secret: '', verify_tls: true };
        },
        async saveNode() {
            const method = this.editingNode ? 'PATCH' : 'POST';
            const url = this.editingNode ? `/api/nodes/${this.form.id}` : '/api/nodes';
            try {
                const resp = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                if (resp.ok) {
                    this.closeModal();
                    this.loadNodes();
                } else {
                    alert('Failed to save node');
                }
            } catch (e) {
                alert('Error saving node');
            }
        },
        async deleteNode(id) {
            if (!confirm('Delete this node?')) return;
            try {
                const resp = await fetch(`/api/nodes/${id}`, { method: 'DELETE' });
                if (resp.ok) this.loadNodes();
            } catch (e) {
                alert('Failed to delete node');
            }
        }
    }
}
</script>
{% endblock %}
