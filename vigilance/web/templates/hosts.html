{% extends "base.html" %}
{% block title %}Hosts{% endblock %}
{% block page_script %}<script defer src="/static/js/actions.js?v={{ asset_version }}"></script><script defer src="/static/js/pages/hosts.js?v={{ asset_version }}"></script>{% endblock %}
{% block content %}
<div x-data="hostsPage" x-cloak>
  <div class="page-head">
    <div><h1>Hosts</h1><p class="muted" x-text="sortHint()"></p></div>
    <div class="action-bar">
      <button class="btn btn-primary" :disabled="!suggested || !suggested.length" :title="suggestTitle()"
              @click="$dispatch('open-actions', { kind: 'suggested', hostIds: null, title: allTitle() })" x-text="'Vorschläge auf allen ' + allWord()"></button>
      <button class="btn" @click="$dispatch('open-actions', { kind: 'full_upgrade', hostIds: null, title: allTitle() })" x-text="'Upgrade aller ' + allGen()"
              title="Alle laufenden Container und eingetragenen VMs, nie der Proxmox-Host"></button>
    </div>
  </div>
  <p class="filter-note" x-show="only">
    <span x-text="'Gefiltert: ' + V.plural(running().length + stopped().length, 'Host', 'Hosts') + (onlyFor ? ' mit ' + onlyFor : '')"></span>
    <button class="btn btn-sm" @click="showAll()">Alle Hosts anzeigen</button>
  </p>
  <section class="panel">
    <div class="sort-mobile">
      <label for="host-sort" class="faint">Sortieren</label>
      <select id="host-sort" class="input input-sm" :value="sort.key ? sort.key + ':' + sort.dir : ''" @change="setSort($event.target.value)">
        <option value="">Dringendste zuerst</option>
        <template x-for="c in columns" :key="c.key">
          <optgroup :label="c.label">
            <option :value="c.key + ':1'" x-text="c.label + ' ▲'"></option>
            <option :value="c.key + ':-1'" x-text="c.label + ' ▼'"></option>
          </optgroup>
        </template>
      </select>
    </div>
    <template x-if="!hosts"><div class="panel-pad"><div class="skeleton"></div></div></template>
    <table class="rows" id="hosts-table" x-show="hosts">
      <thead><tr>
        <template x-for="c in columns" :key="c.key">
          <th :class="c.num ? 'num' : ''" :aria-sort="ariaSort(c.key)">
            <button type="button" class="th-sort" @click="sortBy(c.key)" :title="'Nach ' + c.label + ' sortieren'">
              <span x-text="c.label"></span><span class="sort-mark" aria-hidden="true" x-text="sortMark(c.key)"></span>
            </button>
          </th>
        </template>
      </tr></thead>
      <tbody>
        <template x-for="h in sorted(running())" :key="h.id">
          <tr class="clickable" @click="location.href = '/hosts/' + h.id" @contextmenu="contextMenu($event, h)">
            <td data-label="Name"><a :href="'/hosts/' + h.id" class="pkg" x-text="h.name"></a> <button type="button" class="row-menu" x-show="h.type === 'qemu'" @click.stop="openMenu($event, h)"
                      :aria-label="'Aktionen für ' + h.name" title="Aktionen (auch per Rechtsklick)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16,12A2,2 0 0,1 18,10A2,2 0 0,1 20,12A2,2 0 0,1 18,14A2,2 0 0,1 16,12M10,12A2,2 0 0,1 12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12M4,12A2,2 0 0,1 6,10A2,2 0 0,1 8,12A2,2 0 0,1 6,14A2,2 0 0,1 4,12Z"/></svg></button></td>
            <td data-label="Typ" x-text="typeLabel(h)"></td>
            <td data-label="Nr" class="num" x-text="h.type === 'node' ? '–' : h.vmid"></td>
            <td data-label="System" x-text="h.os || '–'"></td>
            <td data-label="Zustand"><span class="tag" :class="levelClass(h)" x-text="levelText(h)" :title="h.last_scan_error || ''"></span></td>
            <td class="num" data-label="Updates" x-text="h.upgrade_packages || '–'"></td>
            <td class="num" data-label="Altpakete" x-text="h.remove_packages || '–'"></td>
            <td class="num" data-label="Kritisch/hoch behebbar" x-text="(h.patchable_critical + h.patchable_high) || '–'"></td>
            <td class="num" data-label="Ohne Fix" x-text="V.n(h.without_fix)"></td>
            <td data-label="Letzter Scan" class="nowrap" x-text="h.last_scan_at ? V.ago(h.last_scan_at) : '–'"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>
  <section class="panel mt-16" x-show="notScanned().length">
    <details class="fold" open>
      <summary>Läuft, nicht gescannt <span class="muted" x-text="'(' + notScanned().length + ') – VMs; Rechtsklick oder ⋯ zum Aktivieren'"></span></summary>
      <table class="rows">
        <thead><tr><th>Name</th><th>Typ</th><th class="num">Nr</th><th>System</th><th>Hinweis</th></tr></thead>
        <tbody>
          <template x-for="h in sorted(notScanned())" :key="h.id">
            <tr class="clickable" @click="location.href = '/hosts/' + h.id" @contextmenu="contextMenu($event, h)">
              <td data-label="Name"><a :href="'/hosts/' + h.id" class="pkg" x-text="h.name"></a> <button type="button" class="row-menu" x-show="h.type === 'qemu'" @click.stop="openMenu($event, h)"
                      :aria-label="'Aktionen für ' + h.name" title="Aktionen (auch per Rechtsklick)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16,12A2,2 0 0,1 18,10A2,2 0 0,1 20,12A2,2 0 0,1 18,14A2,2 0 0,1 16,12M10,12A2,2 0 0,1 12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12M4,12A2,2 0 0,1 6,10A2,2 0 0,1 8,12A2,2 0 0,1 6,14A2,2 0 0,1 4,12Z"/></svg></button></td>
              <td data-label="Typ" x-text="typeLabel(h)"></td>
              <td data-label="Nr" class="num" x-text="h.vmid"></td>
              <td data-label="System" x-text="h.os_id === 'windows' ? 'Windows' : (h.os || '–')"></td>
              <td data-label="Hinweis" class="faint" x-text="h.os_id === 'windows' ? 'Windows wird nicht gescannt' : 'Nicht für den Scan aktiviert'"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </details>
  </section>
  <section class="panel mt-16" x-show="stopped().length">
    <details class="fold">
      <summary>Gestoppt <span class="muted" x-text="'(' + stopped().length + ') – werden nicht gescannt, Angaben vom letzten Scan'"></span></summary>
      <table class="rows">
        <thead><tr><th>Name</th><th>Typ</th><th class="num">Nr</th><th>Letzter Stand</th></tr></thead>
        <tbody>
          <template x-for="h in sorted(stopped())" :key="h.id">
            <tr class="clickable" @click="location.href = '/hosts/' + h.id" @contextmenu="contextMenu($event, h)">
              <td data-label="Name"><a :href="'/hosts/' + h.id" class="pkg" x-text="h.name"></a> <button type="button" class="row-menu" x-show="h.type === 'qemu'" @click.stop="openMenu($event, h)"
                      :aria-label="'Aktionen für ' + h.name" title="Aktionen (auch per Rechtsklick)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16,12A2,2 0 0,1 18,10A2,2 0 0,1 20,12A2,2 0 0,1 18,14A2,2 0 0,1 16,12M10,12A2,2 0 0,1 12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12M4,12A2,2 0 0,1 6,10A2,2 0 0,1 8,12A2,2 0 0,1 6,14A2,2 0 0,1 4,12Z"/></svg></button></td>
              <td data-label="Typ" x-text="typeLabel(h)"></td>
              <td data-label="Nr" class="num" x-text="h.vmid"></td>
              <td data-label="Letzter Stand" x-text="stoppedNote(h)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </details>
  </section>
  <!-- context menu for VMs (right click or the ⋯ button) -->
  <div class="ctx-menu" role="menu" x-show="menu.host" x-cloak :style="{ left: menu.x + 'px', top: menu.y + 'px' }"
       @click.outside="closeMenu()" @keydown.escape.window="closeMenu()" @scroll.window="scrolled()" @resize.window="closeMenu()">
    <template x-if="menu.host">
      <div>
        <div class="ctx-title" x-text="menu.host.name + ' (VM ' + menu.host.vmid + ')'"></div>
        <button type="button" role="menuitem" x-show="!menu.host.scan_configured" :disabled="menu.host.os_id === 'windows'"
                @click="askEnable(menu.host)" x-text="menu.host.os_id === 'windows' ? 'Windows wird nicht gescannt' : 'Für den Scan aktivieren …'"></button>
        <button type="button" role="menuitem" x-show="menu.host.scan_configured" @click="disableScan(menu.host)">Scan deaktivieren</button>
        <a role="menuitem" :href="'/hosts/' + menu.host.id">Ansicht öffnen</a>
      </div>
    </template>
  </div>

  <!-- activate a VM for scanning -->
  <template x-if="enable.host">
    <div class="dialog-scrim" @click.self="enable.host = null" @keydown.escape.window="enable.host = null">
      <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="enable-title" @submit.prevent="enableScan()">
        <h2 id="enable-title" x-text="enable.host.name + ' für den Scan aktivieren'"></h2>
        <p class="muted">Vigilance scannt die VM wie einen Container: per SSH als root, nur mit apt (Debian, Ubuntu). Danach startet ein Scan.</p>
        <div class="field"><label for="vm-ip">IP-Adresse</label>
          <input id="vm-ip" class="input" x-model.trim="enable.ip" placeholder="leer: vom QEMU Guest Agent" autocomplete="off">
          <span class="hint">Ohne IP fragt Vigilance den Guest Agent; der muss in der VM laufen, und der Proxmox-Token braucht VM.GuestAgent.Audit.</span></div>
        <div class="field" x-show="enable.key"><label>Schlüssel in der VM eintragen (als root)</label>
          <div class="cmd"><code x-text="keyCommand()"></code></div>
          <div><button type="button" class="btn btn-sm" @click="V.copy(keyCommand())">Kopieren</button></div></div>
        <div class="actions">
          <button type="button" class="btn" @click="enable.host = null">Abbrechen</button>
          <button type="submit" class="btn btn-primary" :disabled="enable.saving">Aktivieren und scannen</button>
        </div>
      </form>
    </div>
  </template>
  {% include "_actions.html" %}
</div>
{% endblock %}
