{% extends "base.html" %}
{% block title %}Host{% endblock %}
{% block page_script %}<script defer src="/static/js/actions.js?v={{ asset_version }}"></script><script defer src="/static/js/drawer.js?v={{ asset_version }}"></script><script defer src="/static/js/pages/host.js?v={{ asset_version }}"></script>{% endblock %}
{% block content %}
<div x-data="hostPage({{ inventory_id }})" x-cloak @vigilance-changed.window="load()">
  <p class="back-row mb-10">
    <a href="/hosts" class="back-link" data-back aria-label="Zurück" title="Zurück">
      <!-- Material Design Icons (Apache-2.0): chevron-left -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"/></svg>
    </a>
    <a href="/hosts">Alle Hosts</a>
  </p>
  <template x-if="error"><div class="panel empty"><h3>Host nicht gefunden</h3><p x-text="error"></p></div></template>
  <template x-if="h">
    <div class="stack">
      <div class="page-head">
        <div>
          <h1 x-text="h.name"></h1>
          <p class="muted" x-text="[V.hostLabel(h), h.ip_address, h.os].filter(Boolean).join(', ')"></p>
        </div>
        <div class="right">
          <p x-text="h.last_scan_at ? 'Letzter Scan ' + V.ago(h.last_scan_at) : 'Noch nicht gescannt'"></p>
          <p class="faint" x-show="h.last_scan_at" x-text="V.date(h.last_scan_at)"></p>
        </div>
      </div>

      <template x-if="(h.type === 'lxc' || h.type === 'node') && h.status === 'running'">
        <div class="panel panel-pad action-bar">
          <p class="muted" x-text="h.type === 'node'
            ? 'Vigilance kann die Befehle auf dem Proxmox-Host ausführen, über eine sudo-Regel für apt-get. Vorher siehst du in einer Simulation, was sich ändert, und bestätigst ausdrücklich.'
            : 'Vigilance kann die Befehle auf diesem Container selbst ausführen. Vorher siehst du in einer Simulation, was sich ändert.'"></p>
          <button class="btn btn-primary" :disabled="!suggested" :title="suggested === null ? 'Prüfe, ob es Vorschläge gibt …' : (suggested ? '' : 'Keine Vorschläge für diesen Host')"
                  @click="$dispatch('open-actions', { kind: 'suggested', hostIds: [h.id], title: h.name })">Vorschläge umsetzen</button>
          <button class="btn" @click="$dispatch('open-actions', { kind: 'full_upgrade', hostIds: [h.id], title: h.name })" x-text="h.type === 'node' ? 'dist-upgrade' : 'Vollständiges Upgrade'"></button>
        </div>
      </template>
      <template x-if="h.kernel">
        <section class="panel panel-pad stack">
          <div class="action-bar">
            <div class="grow">
              <h2>Kernel im Container</h2>
              <p class="muted mt-6">Ein LXC-Container verwendet immer den Kernel des Proxmox-Hosts<span x-text="h.kernel.running_kernel ? ' (' + h.kernel.running_kernel + ')' : ''"></span>. Kernel-Pakete im Container werden nie geladen. Meist kommen sie als Abhängigkeit mit, zum Beispiel mit dem Paket <code>wireguard</code>.</p>
            </div>
            <button class="btn" x-show="h.status === 'running'" @click="$dispatch('open-actions', { kind: 'kernel_cleanup', hostIds: [h.id], title: h.name })">Kernel aufräumen</button>
          </div>
          <p x-show="h.kernel.installed.length"><span class="tag">Installiert</span> <span class="ver" x-text="h.kernel.installed.join(', ')"></span></p>
          <p x-show="h.kernel.remnants.length"><span class="tag">Reste (rc)</span> <span class="ver" x-text="h.kernel.remnants.join(', ')"></span></p>
          <div class="cmd"><code x-text="h.kernel.command"></code><button class="btn btn-sm" @click="V.copy(h.kernel.command)">Kopieren</button></div>
          <div class="risk" :data-status="h.kernel.error ? 'unknown' : (h.kernel.extra.length ? 'check' : 'ok')">
            <p class="risk-head" x-text="h.kernel.error ? 'Simulation fehlgeschlagen' : (h.kernel.extra.length ? 'Vor dem Ausführen prüfen' : 'Geprüft: nur Kernel-Pakete')"></p>
            <ul>
              <li x-show="h.kernel.error" x-text="h.kernel.error"></li>
              <li x-show="h.kernel.extra.length" x-text="'apt würde zusätzlich entfernen: ' + h.kernel.extra.join(', ') + '. Prüfe, ob du das noch brauchst.' + (h.kernel.extra.includes('wireguard') ? ' wireguard ist ein Meta-Paket, das den Kernel nachzieht; die eigentlichen Werkzeuge stecken in wireguard-tools.' : '')"></li>
              <li x-text="'Simulation beim letzten Scan: ' + h.kernel.would_remove.length + ' Pakete würden entfernt, darunter initramfs-tools und Kernel-Firmware, falls vorhanden.'"></li>
              <li x-show="!h.kernel.extra.length && !h.kernel.error">„Vorschläge umsetzen“ führt das mit aus.</li>
            </ul>
          </div>
        </section>
      </template>
      <template x-if="h.type === 'node'">
        <div class="panel panel-pad note-node">
          <h2>Was hier nicht geprüft wird</h2>
          <p class="muted mt-10">Pakete von Proxmox selbst (<code>pve-*</code>, <code>proxmox-*</code>, der Proxmox-Kernel) fehlen in den Debian-Sicherheitsdaten. Für sie zeigt Vigilance keine Befunde. Die Angaben unten betreffen nur die Debian-Pakete auf dem Host. Ob es für die Proxmox-Pakete Updates gibt, zeigt <code>apt list --upgradable</code> auf dem Host.</p>
          <p class="faint mt-6">Vigilance prüft den Host ohne Root-Rechte, als Benutzer <code>vigilance-scan</code>.</p>
        </div>
      </template>
      <template x-if="V.scanReason(h)">
        <div class="panel panel-pad"><h2 x-text="V.scanReason(h)"></h2>
          <p class="muted mt-10" x-text="h.status !== 'running' ? 'Gestoppte Container werden nicht gescannt. Die Angaben unten stammen vom letzten erfolgreichen Scan.' : 'Vigilance konnte diesen Host beim letzten Scan nicht prüfen. Angaben unten stammen von früher, falls vorhanden.'"></p>
        </div>
      </template>

      <section class="panel">
        <div class="panel-head"><h2>Jetzt beheben</h2><span class="muted" x-text="V.plural(h.patchable, 'Befund', 'Befunde')"></span></div>
        <template x-if="!h.patchable_list.length"><div class="empty"><h3>Nichts zu tun</h3><p>Für die installierten Pakete gibt es keine offenen Befunde mit Fix.</p></div></template>
        <div class="panel-pad" x-show="h.upgrade_command || h.remove_command">
          <template x-if="h.upgrade_command">
            <div>
              <p class="cmd-label">Updates installieren</p>
              <div class="cmd"><code x-text="h.upgrade_command"></code><button class="btn btn-sm" @click="V.copy(h.upgrade_command)">Kopieren</button></div>
            </div>
          </template>
          <template x-if="h.remove_command">
            <div>
              <p class="cmd-label">Ältere Versionen entfernen, die neben neueren installiert sind. Zuerst simulieren (<code>-s</code> ändert nichts), dann ausführen.</p>
              <div class="cmd"><code x-text="h.remove_simulation"></code><button class="btn btn-sm" @click="V.copy(h.remove_simulation)">Kopieren</button></div>
              <div class="cmd"><code x-text="h.remove_command"></code><button class="btn btn-sm" @click="V.copy(h.remove_command)">Kopieren</button></div>
              <div class="risk" :data-status="h.remove_risk ? h.remove_risk.status : 'unknown'">
                <p class="risk-head" x-text="V.riskHead(h.remove_risk)"></p>
                <ul><template x-for="line in V.riskLines(h.remove_risk)" :key="line"><li x-text="line"></li></template></ul>
                <p class="faint" x-show="V.reinstallText(h.remove_risk)" x-text="V.reinstallText(h.remove_risk)"></p>
              </div>
            </div>
          </template>
        </div>
        <table class="rows" x-show="h.patchable_list.length">
          <thead><tr><th></th><th>Paket</th><th>Aktion</th><th>Schwere</th><th class="num">Lücken</th><th>Betroffene Pakete</th></tr></thead>
          <template x-for="g in h.patchable_list" :key="g.package + g.installed_version">
            <tbody>
              <tr class="clickable" @click="toggle(g)">
                <td class="hide-sm"><span class="caret" :class="{ open: isOpen(g) }">›</span></td>
                <td><span class="pkg" x-text="g.display_name"></span><div class="ver" x-text="g.installed_version + (g.obsolete ? '' : ' → ' + (g.fixed_version || '?'))"></div>
                  <div class="src-hint" x-show="g.display_name !== g.package" x-text="'Quellpaket ' + g.package"></div></td>
                <td data-label="Aktion"><span class="tag" :class="g.obsolete ? 'tag-remove' : 'tag-upgrade'" x-text="g.obsolete ? 'Entfernen' : 'Update'"></span></td>
                <td data-label="Schwere"><span class="sev" :class="'sev-' + g.severity" x-text="V.sevLabel(g.severity)"></span></td>
                <td class="num" data-label="Lücken" x-text="g.count"></td>
                <td data-label="Pakete" class="ver" x-text="g.binaries.join(', ')"></td>
              </tr>
              <template x-if="isOpen(g)">
                <tr class="sub"><td class="hide-sm"></td><td colspan="5"><div x-data="{ rem: g.remedy }">{% include "_remedy.html" %}</div></td></tr>
              </template>
              <template x-for="a in (isOpen(g) ? g.advisories : [])" :key="a.finding_id">
                <tr class="sub clickable" @click="$dispatch('open-vuln', { id: a.cve_entry_id })">
                  <td class="hide-sm"></td>
                  <td colspan="2"><a href="#" @click.prevent x-text="a.label"></a><span class="info" tabindex="0" role="img" x-show="a.note" :aria-label="a.note" :data-tip="a.note" @click.stop>i</span> <span class="also" x-show="a.also.length" x-text="'auch ' + a.also.join(', ')"></span>
                    <span class="os-hint" x-show="a.os_hint" x-text="'laut Meldung nur ' + a.os_hint"></span></td>
                  <td><span class="sev" :class="'sev-' + a.severity" x-text="V.sevLabel(a.severity)"></span></td>
                  <td class="num" x-text="a.cvss ? 'CVSS ' + a.cvss : ''"></td>
                  <td class="ver" x-text="a.fixed_version ? 'Fix ' + a.fixed_version : ''"></td>
                </tr>
              </template>
            </tbody>
          </template>
        </table>
      </section>

      <template x-if="h.foreign_sources && h.foreign_sources.length">
        <section class="panel">
          <details class="fold">
            <summary>Pakete aus fremden Paketquellen <span class="muted" x-text="'(' + h.foreign_sources.reduce((n, g) => n + g.uncovered.length + g.covered.length + (g.debian || []).length, 0) + ')'"></span></summary>
            <div class="panel-pad stack">
              <p class="muted">Diese Pakete stammen nicht aus Debian. Wie gut Vigilance sie prüfen kann, hängt davon ab, ob es passende Sicherheitsdaten gibt. Mehr unter <a href="/admin/limits">Grenzen von Vigilance</a>.</p>
              <template x-for="g in h.foreign_sources" :key="g.source">
                <div>
                  <p class="remedy-host" x-text="g.source"></p>
                  <p x-show="g.covered.length"><span class="tag tag-ok">Geprüft</span><span class="info" tabindex="0" role="img" x-show="V.notes.goModule" :aria-label="V.notes.goModule" :data-tip="V.notes.goModule" @click.stop>i</span>
                    <span x-text="g.covered.map((c) => c.package + ' (Go-Modul ' + c.module + ')').join(', ')"></span></p>
                  <p class="mt-6" x-show="(g.debian || []).length"><span class="tag tag-upgrade">Nur Debian-Daten</span><span class="info" tabindex="0" role="img" x-show="V.notes.debianData" :aria-label="V.notes.debianData" :data-tip="V.notes.debianData" @click.stop>i</span>
                    <span class="ver" x-text="g.debian.length > 12 ? g.debian.slice(0, 12).join(', ') + ' und ' + (g.debian.length - 12) + ' weitere' : g.debian.join(', ')"></span></p>
                  <p class="mt-6" x-show="g.uncovered.length"><span class="tag">Keine Sicherheitsdaten</span><span class="info" tabindex="0" role="img" x-show="V.notes.noData" :aria-label="V.notes.noData" :data-tip="V.notes.noData" @click.stop>i</span>
                    <span class="ver" x-text="g.uncovered.length > 12 ? g.uncovered.slice(0, 12).join(', ') + ' und ' + (g.uncovered.length - 12) + ' weitere' : g.uncovered.join(', ')"></span></p>
                </div>
              </template>
            </div>
          </details>
        </section>
      </template>

      <template x-for="sec in folds()" :key="sec.key">
        <section class="panel">
          <details class="fold">
            <summary x-text="sec.title"></summary>
            <p class="muted panel-pad" x-show="!sec.list.length" x-text="sec.empty"></p>
            <table class="rows" x-show="sec.list.length">
              <thead><tr><th>Paket</th><th>Schwere</th><th class="num">Lücken</th><th>Hinweis</th></tr></thead>
              <template x-for="g in sec.list" :key="g.package + g.installed_version">
                <tbody>
                  <tr class="clickable" @click="toggle(g)">
                    <td><span class="caret" :class="{ open: isOpen(g) }">›</span> <span class="pkg" x-text="g.display_name"></span> <span class="ver" x-text="g.installed_version"></span></td>
                    <td data-label="Schwere"><span class="sev" :class="'sev-' + g.severity" x-text="V.sevLabel(g.severity)"></span></td>
                    <td class="num" data-label="Lücken" x-text="g.count"></td>
                    <td data-label="Hinweis" class="faint" x-text="hint(sec.key, g)"></td>
                  </tr>
                  <template x-for="a in (isOpen(g) ? g.advisories : [])" :key="a.finding_id">
                    <tr class="sub clickable" @click="$dispatch('open-vuln', { id: a.cve_entry_id })">
                      <td><a href="#" @click.prevent x-text="a.label"></a><span class="info" tabindex="0" role="img" x-show="a.note" :aria-label="a.note" :data-tip="a.note" @click.stop>i</span> <span class="also" x-show="a.also.length" x-text="'auch ' + a.also.join(', ')"></span></td>
                      <td><span class="sev" :class="'sev-' + a.severity" x-text="V.sevLabel(a.severity)"></span></td>
                      <td class="num" x-text="a.cvss ? 'CVSS ' + a.cvss : ''"></td>
                      <td class="faint" x-text="sec.key === 'fixed' ? 'behoben ' + V.day(a.resolved_at) : (sec.key === 'not_affected' ? 'nur ' + a.only_on.join(', ') : (a.os_hint ? 'laut Meldung nur ' + a.os_hint : (a.urgency === 'unimportant' ? 'Debian: unwichtig' : '')))"></td>
                    </tr>
                  </template>
                </tbody>
              </template>
            </table>
          </details>
        </section>
      </template>
    </div>
  </template>
  {% include "_drawer.html" %}
  {% include "_actions.html" %}
</div>
{% endblock %}
