name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vigilance
          POSTGRES_PASSWORD: vigilance
          POSTGRES_DB: vigilance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigilance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" playwright
      - name: Unit tests (SQLite and PostgreSQL)
        env:
          VIGILANCE_TEST_PG_URL: postgresql+asyncpg://vigilance:vigilance@localhost/vigilance_test
        run: pytest -q tests/unit
      - name: Browser tests (Chrome of the runner image)
        env:
          VIGILANCE_E2E: "1"
          VIGILANCE_E2E_CHROME: /usr/bin/google-chrome
        run: pytest -q tests/e2e
