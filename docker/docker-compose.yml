services:
  postgres:
    image: postgres:16-alpine
    container_name: vigilance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigilance
      POSTGRES_PASSWORD: vigilance
      POSTGRES_DB: vigilance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilance -d vigilance"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vigilance:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vigilance
    restart: unless-stopped
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - VIGILANCE_DATABASE_URL=postgresql+asyncpg://vigilance:vigilance@postgres:5432/vigilance
      - VIGILANCE_CONFIG_PATH=/app/data/config.yaml
    env_file:
      - ../.env
    volumes:
      - vigilance_config:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
    driver: local
  vigilance_config:
    driver: local